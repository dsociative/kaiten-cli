name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Public API of the published `kaiten-client` crate: this pull request vs its
  # base commit. Additive changes pass; a breaking change fails unless the PR
  # carries the `breaking` label (read live, so re-running after labelling
  # counts), which declares an intentional major (0.y) bump. The release-time
  # check against the last tag is run locally (see AGENTS.md). Known blind
  # spot of cargo-semver-checks 0.50: a removed derive (e.g. `Default`) is not
  # reported — list such breaks in the PR by hand.
  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-semver-checks
      - uses: Swatinem/rust-cache@v2
      - name: Release type from the PR labels
        id: release-type
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view "${{ github.event.pull_request.number }}" --json labels -q '.labels[].name' | grep -qx breaking; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          else
            echo "type=minor" >> "$GITHUB_OUTPUT"
          fi
      - run: cargo semver-checks check-release -p kaiten-client --baseline-rev ${{ github.event.pull_request.base.sha }} --release-type ${{ steps.release-type.outputs.type }}

  # Line coverage of the whole workspace test suite, including the `kaiten`
  # binary the integration tests spawn (cargo-llvm-cov instruments child
  # processes too). Uploaded to Codecov for the README badge and the PR
  # coverage comment. CODECOV_TOKEN is an Actions secret and a Dependabot
  # secret; PRs from forks have neither, so an upload failure only fails the
  # job for pushes and same-repo PRs.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

  # Tests use unix-only permission APIs; on Windows we verify the build only.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
